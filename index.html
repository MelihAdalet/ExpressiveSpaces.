  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Expressive CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      overflow-x: hidden;
      /* Smooth transition for theme variables */
      transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1), color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root {
      --primary: rgb(99, 102, 241);
      /* Light mode defaults */
      --surface: 250, 250, 252; 
      --text: 15, 15, 20;
    }
    .dark {
      /* Dark mode overrides */
      --surface: 10, 10, 12;
      --text: 255, 255, 255;
    }
    /* Dynamic primary color utility */
    .bg-primary { background-color: var(--primary); }
    .text-primary { color: var(--primary); }
    .border-primary { border-color: var(--primary); }
    
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Enhanced Prose for better readability */
    .prose-expressive {
      color: rgb(var(--text));
    }
    .prose-expressive p {
      margin-bottom: 2rem;
      line-height: 1.8;
      font-weight: 500;
      opacity: 0.9;
    }
    .prose-expressive h1, .prose-expressive h2, .prose-expressive h3 {
      color: rgb(var(--text));
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    
    /* Custom Skeleton Animation */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .skeleton-shimmer {
      position: relative;
      overflow: hidden;
    }
    .skeleton-shimmer::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.05),
        transparent
      );
      animation: shimmer 1.5s infinite;
    }
  </style>
